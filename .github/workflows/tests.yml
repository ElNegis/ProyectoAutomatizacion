name: Suite de pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar suite (Chrome y Firefox, headless)
        run: mvn --batch-mode clean test -Dheadless=true

      - name: Subir reportes y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            target/surefire-reports
            target/capturas
          if-no-files-found: ignore
